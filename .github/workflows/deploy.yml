name: Deploy to Xserver

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate && php artisan test
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci && npm run build
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    concurrency:
      group: camp-hikaku-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Additive migrations run before new views/controllers reference new columns.
      - name: Upload migrations
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './database/migrations/*'
          remote_path: '/home/xs501620/camp-hikaku.jp/app/database/migrations/'
          sftp_only: true
          delete_remote_files: false

      - name: Apply additive migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd ~/camp-hikaku.jp/app
            PHP=$(command -v php8.3 || command -v php)
            $PHP artisan migrate --force

      - name: Deploy to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './public/*'
          remote_path: '/home/xs501620/camp-hikaku.jp/public_html/'
          sftp_only: true
          delete_remote_files: false

      # public/ しか送っていなかったため、blade を直しても本番に届かなかった。
      # サーバ上では public_html が app/public へのシンボリックリンクで、
      # Laravel 本体は <ドメイン>/app/ に置かれている。
      #   ~/camp-hikaku.jp/app/            リポジトリのルート相当
      #   ~/camp-hikaku.jp/public_html  -> app/public
      #
      # 消す操作は一切しない。views の更新だけを届ける。
      #
      # 注意: app/ routes/ config/ は対象外なので、コントローラやルートを
      # 変えたときは別途デプロイが要る。

      # views だけを送っていたところ、リポジトリ側のビューが参照するルート
      # (areas.index) が本番に無く、トップが500になった。ビューと食い違わない
      # よう、コントローラとルートも一緒に送る。
      - name: Deploy application code to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './app/*'
          remote_path: '/home/xs501620/camp-hikaku.jp/app/app/'
          sftp_only: true
          delete_remote_files: false

      - name: Deploy routes to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './routes/*'
          remote_path: '/home/xs501620/camp-hikaku.jp/app/routes/'
          sftp_only: true
          delete_remote_files: false

      # Application and routes must exist before templates reference new endpoints.
      - name: Deploy views to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './resources/*'
          remote_path: '/home/xs501620/camp-hikaku.jp/app/resources/'
          sftp_only: true
          delete_remote_files: false

      - name: Upload verified facility seeder
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './database/seeders/*Seeder.php'
          remote_path: '/home/xs501620/camp-hikaku.jp/app/database/seeders/'
          sftp_only: true
          delete_remote_files: false

      - name: Import verified facilities without overwriting existing records
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd ~/camp-hikaku.jp/app
            PHP=$(command -v php8.3 || command -v php)
            $PHP artisan db:seed --class=VerifiedWellnessSeeder --force
            $PHP artisan db:seed --class=MetropolitanGuideSeeder --force
            $PHP artisan db:seed --class=KansaiGuideSeeder --force
            $PHP artisan db:seed --class=CityGuideSeeder --force
            $PHP artisan db:seed --class=ApiVerifiedFacilitiesSeeder --force

      - name: Clear route and view caches
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/camp-hikaku.jp/app
            PHP=$(command -v php8.3 || command -v php || echo /opt/php-8.3.30/bin/php)
            $PHP artisan route:clear
            $PHP artisan view:clear
            $PHP artisan config:clear
